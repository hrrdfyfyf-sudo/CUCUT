<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Arian Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0b0716;--p1:#16102a;--p2:#261c44;--tx:#f6f1ff;--mu:#9d90bd;--a:#ff3d9a;--b:#22d3ee;--c:#ffd23f;--d:#7c4dff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--tx);font:14px/1.3 "Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg{width:22px;height:22px;display:block}
.scr{flex:1;min-height:0;display:none;flex-direction:column}.scr.on{display:flex}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.chip{background:var(--p2);border-radius:12px;padding:7px 12px;font-weight:700;font-size:13px}
.exp{background:linear-gradient(135deg,var(--b),var(--d));color:#fff;border-radius:12px;padding:8px 16px;font-weight:800;box-shadow:0 0 14px #22d3ee66}
#splash{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;background:radial-gradient(circle at 15% 15%,#ff3d9a,transparent 50%),radial-gradient(circle at 90% 35%,#22d3ee,transparent 45%),radial-gradient(circle at 50% 100%,#ffd23f,transparent 50%),#261c44;transition:opacity .5s}
#splash h1{margin:0;font:900 clamp(38px,12vw,64px) "Arial Black",sans-serif;text-shadow:0 4px 0 #7c4dff;animation:pop .9s}
#splash p{margin:10px 0 24px;font-size:17px}
@keyframes pop{from{transform:scale(.5) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.big{display:block;width:100%;text-align:center;padding:13px;border-radius:14px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--a),var(--d));margin-top:8px;text-decoration:none}
.big.g{background:var(--p2)}.big.dis{opacity:.5;pointer-events:none}
#home{background:linear-gradient(180deg,#2b1259 0,var(--bg) 280px)}
.hh{display:flex;align-items:center;padding:14px 16px 4px;font:900 22px "Arial Black",sans-serif}.hh span{flex:1}
.nv{margin:10px 16px;border-radius:22px;padding:14px 16px;background:linear-gradient(135deg,var(--a),var(--d) 60%,var(--b));display:flex;align-items:center;justify-content:center;gap:10px;position:relative;font-weight:800;font-size:17px;box-shadow:0 8px 30px #7c4dff55;width:calc(100% - 32px)}
.nv .wd{position:absolute;top:7px;right:12px;opacity:.95}.nv .wd svg{width:20px;height:20px}.nv i{width:34px;height:34px;border-radius:14px;background:#0b0716;display:grid;place-items:center}
.qa{display:flex;gap:8px;padding:0 16px 4px}.qa button{flex:1;background:var(--p2);border-radius:14px;padding:10px 4px;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}.qa svg{width:20px;height:20px}.qa button:nth-child(1) svg{color:#ff8a3d}.qa button:nth-child(2) svg{color:#ff3d9a}.qa button:nth-child(3) svg{color:#22d3ee}
