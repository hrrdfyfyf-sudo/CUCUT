<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Arian Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0b0716;--p1:#16102a;--p2:#261c44;--tx:#f6f1ff;--mu:#9d90bd;--a:#ff3d9a;--b:#22d3ee;--c:#ffd23f;--d:#7c4dff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;margin:0;overflow:hidden;background:#06040d;color:var(--tx);font:14px/1.3 "Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg{width:22px;height:22px;display:block}
.scr{flex:1;min-height:0;display:none;flex-direction:column}.scr.on{display:flex}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.chip{background:var(--p2);border-radius:12px;padding:7px 12px;font-weight:700;font-size:13px}
.exp{background:linear-gradient(135deg,var(--b),var(--d));color:#fff;border-radius:12px;padding:8px 16px;font-weight:800;box-shadow:0 0 14px #22d3ee66}
#splash{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;background:radial-gradient(circle at 15% 15%,#ff3d9a,transparent 50%),radial-gradient(circle at 90% 35%,#22d3ee,transparent 45%),radial-gradient(circle at 50% 100%,#ffd23f,transparent 50%),#261c44;transition:opacity .5s}
#splash h1{margin:0;font:900 clamp(38px,12vw,64px) "Arial Black",sans-serif;text-shadow:0 4px 0 #7c4dff;animation:pop .9s}
#splash p{margin:10px 0 24px;font-size:17px}
@keyframes pop{from{transform:scale(.5) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.big{display:block;width:100%;text-align:center;padding:13px;border-radius:14px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--a),var(--d));margin-top:8px;text-decoration:none}
.big.g{background:var(--p2)}.big.dis{opacity:.5;pointer-events:none}
#home{background:linear-gradient(180deg,#2b1259 0,var(--bg) 280px)}
.hh{display:flex;align-items:center;padding:14px 16px 4px;font:900 22px "Arial Black",sans-serif}.hh span{flex:1}
.nv{margin:10px 16px;border-radius:22px;padding:14px 16px;background:linear-gradient(135deg,var(--a),var(--d) 60%,var(--b));display:flex;align-items:center;justify-content:center;gap:10px;position:relative;font-weight:800;font-size:17px;box-shadow:0 8px 30px #7c4dff55;width:calc(100% - 32px)}
.nv .wd{position:absolute;top:7px;right:12px;opacity:.95}.nv .wd svg{width:20px;height:20px}.nv i{width:34px;height:34px;border-radius:14px;background:#0b0716;display:grid;place-items:center}
.qa{display:flex;gap:8px;padding:0 16px 4px}.qa button{flex:1;background:var(--p2);border-radius:14px;padding:10px 4px;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}.qa svg{width:20px;height:20px}.qa button:nth-child(1) svg{color:#ff8a3d}.qa button:nth-child(2) svg{color:#ff3d9a}.qa button:nth-child(3) svg{color:#22d3ee}
.sec{padding:10px 16px 6px;font:800 18px "Arial Black",sans-serif}
.pl{flex:1;overflow:auto;padding:0 16px 14px}
.pc{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.pc video{width:78px;height:78px;object-fit:cover;border-radius:12px;background:#000;pointer-events:none;flex:none}
.pc .in{flex:1;min-width:0;text-align:left}.pc b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pc small{color:var(--mu)}
.empty{text-align:center;color:#e0e0e0;padding:30px 10px}.empty svg{width:64px;height:64px;margin:0 auto 10px;color:#6f6590}
.top{display:flex;align-items:center;gap:8px;padding:8px 10px}.top .sp{flex:1}
.stage{flex:1;min-height:120px;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
#fr{position:relative;overflow:hidden;background:#000;flex:none}
#v{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.ov{position:absolute;transform:translate(-50%,-50%);font-weight:900;white-space:nowrap;touch-action:none;text-shadow:0 2px 6px #000;padding:12px 16px;z-index:3}
.ov.sel{outline:2px dashed var(--c)}
.ctl{display:flex;align-items:center;padding:6px 14px;font-size:13px;color:#cfc6e8;background:#0000}
.ctl .m{flex:1;text-align:center}.ctl b{color:var(--tx)}
#vo{position:absolute;top:170px;left:0;height:26px;width:100%}#vo b{position:absolute;top:0;height:100%;border-radius:10px;background:linear-gradient(135deg,#06b6d4,#8b5cf6);font-size:11px;font-weight:800;padding:5px 8px;overflow:hidden;white-space:nowrap}#vo b.sel{outline:2px solid #fff}
#tw{position:relative;height:204px;flex:none;border-top:1px solid #ffffff14;background:linear-gradient(180deg,#0d0820,#150e2b)}
#tl{touch-action:pan-x;position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}#tl::-webkit-scrollbar{display:none}
#ti{position:relative;height:100%}
#ru{position:absolute;top:0;left:0;height:22px;width:100%;pointer-events:none}
#ru span{position:absolute;top:4px;font-size:10px;color:#8f84b3;font-weight:700;transform:translateX(-50%)}
#vt{position:absolute;top:28px;left:0;height:56px;display:flex}
.sg{height:100%;display:flex;overflow:hidden;border-radius:10px;border-right:3px solid #0d0820;background:linear-gradient(135deg,#0e7490,#2563eb);box-shadow:0 3px 10px #0007;position:relative}
.sg img{height:100%;flex:none;object-fit:cover}.sg.sel{outline:3px solid var(--c);outline-offset:-3px;box-shadow:0 0 16px #ffd23f88;z-index:2}
.sg em{position:absolute;right:4px;bottom:2px;font-size:10px;font-style:normal;background:#ffd23f;color:#201500;font-weight:800;padding:1px 6px;border-radius:5px}
#at{position:absolute;top:88px;height:18px;display:flex}
#at i{height:100%;background:repeating-linear-gradient(90deg,#4ade8099 0 2px,transparent 2px 6px),linear-gradient(#065f46,#047857);border-radius:7px;opacity:1}
#xt{position:absolute;top:110px;left:0;height:26px;width:100%}
#xt b{position:absolute;top:0;height:100%;border-radius:10px;background:linear-gradient(135deg,#f59e0b,#ef4444);color:#1a0b00;font-size:12px;font-weight:800;padding:6px 8px;overflow:hidden;white-space:nowrap;box-shadow:0 3px 10px #0006;touch-action:none}
#xt b.sel,#vo b.sel{outline:2px solid #fff}
#ph{position:absolute;left:50%;top:6px;bottom:4px;width:3px;margin-left:-1.5px;background:linear-gradient(var(--a),#fff);border-radius:2px;box-shadow:0 0 12px var(--a);pointer-events:none;z-index:5}
#ph::before{content:"";position:absolute;left:50%;top:-5px;width:14px;height:14px;margin-left:-7px;background:var(--a);border-radius:50%;box-shadow:0 0 10px var(--a)}
#sr{display:none;grid-template-columns:auto 1fr auto 38px;gap:10px;align-items:center;position:fixed;left:10px;right:10px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:linear-gradient(160deg,#2a1f4a,#171031);border:1px solid #ffffff22;border-radius:24px;padding:14px 14px 14px 18px;box-shadow:0 14px 40px #000c}#sr.on{display:grid}#sr input{accent-color:var(--a);height:30px}#sr output{text-align:center;color:var(--c);font-weight:800;background:#ffffff14;border-radius:99px;padding:4px 10px;min-width:54px}#sr .ib{width:34px;height:34px;background:#ffffff18}
#bt{background:linear-gradient(180deg,#171031,#0d0820);border-radius:24px 24px 0 0;border-top:1px solid #ffffff1c;box-shadow:0 -10px 30px #0008;flex:none}
.bar{display:flex;overflow-x:auto;padding:8px 6px 10px;gap:2px;scrollbar-width:none}.bar::-webkit-scrollbar{display:none}
.bar button{flex:none;width:78px;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 0 6px;color:#d9d0f2;background:#ffffff0a;border-radius:16px;margin:0 3px}
.bar button svg{width:46px;height:46px;padding:11px;border-radius:16px;background:color-mix(in srgb,currentColor 16%,transparent);border:1px solid color-mix(in srgb,currentColor 35%,transparent);transition:transform .15s}
.bar button:active svg{transform:scale(.88)}
.bar button.dis{opacity:.35;pointer-events:none}
.bar .bk{width:52px;border-right:1px solid #ffffff1a;margin-right:4px}
#sub{display:none}#sub.on{display:flex}#main.off{display:none}
#tp{display:none;padding:12px 14px;gap:8px;flex-direction:column;background:linear-gradient(160deg,#2a1f4a,#171031);margin:8px;border-radius:20px;border:1px solid #ffffff1c;max-height:44vh;overflow:auto}#tp.on{display:flex}
#tp .r{display:flex;gap:8px;align-items:center}#tp input[type=range]{flex:1;accent-color:var(--a)}
input[type=text]{width:100%;background:#ffffff10;color:var(--tx);border:1px solid #ffffff2a;border-radius:14px;padding:11px 12px;font:inherit;user-select:text}
.fl{display:flex;gap:10px;overflow-x:auto;padding:10px}
.fl button{flex:none;width:74px;height:74px;border-radius:18px;font-size:12px;font-weight:700;color:#fff;display:flex;align-items:flex-end;justify-content:center;padding:3px;border:2px solid #ffffff30;box-shadow:0 6px 14px #0007;text-shadow:0 1px 4px #000}
#fxp{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-height:48vh;overflow:auto;background:linear-gradient(160deg,#2a1f4a,#171031);border:1px solid #ffffff22;border-radius:24px;padding:14px 16px 16px;box-shadow:0 14px 40px #000c;z-index:30}input[type=range]{height:28px}
.sl{display:grid;grid-template-columns:92px 1fr 62px;gap:10px;align-items:center;font-size:13px;font-weight:700;margin:6px 0}.sl output{text-align:center;color:var(--c);background:#ffffff14;border-radius:99px;padding:4px 10px;font-weight:800;min-width:54px}
input[type=range]{width:100%;accent-color:var(--a);-webkit-appearance:none;appearance:none;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:99px;background:linear-gradient(90deg,var(--a),var(--d)) 0/var(--p,50%) 100% no-repeat,#ffffff1c}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-8px;border-radius:50%;background:#fff;border:4px solid var(--a);box-shadow:0 2px 10px #000a}
#rcs{background:#0000;pointer-events:none}#rcs>div{pointer-events:auto;box-shadow:0 -8px 30px #000a}
.sheet{position:fixed;inset:0;z-index:40;background:#000a;display:none;align-items:flex-end}.sheet.on{display:flex}
.sheet>div{width:100%;background:linear-gradient(180deg,#221842,#120d24);border-radius:28px 28px 0 0;border-top:1px solid #ffffff22;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.sheet>div::before{content:"";display:block;width:44px;height:5px;border-radius:9px;background:#ffffff33;margin:-6px auto 12px}
.sheet h3{margin:0 0 6px;font-size:18px}.sheet p{color:var(--mu);margin:4px 0}
.seg{display:flex;background:#ffffff0f;border-radius:16px;padding:4px;margin:6px 0 10px}
.seg button{flex:1;padding:12px;border-radius:13px;font-weight:700}.seg button.on{background:linear-gradient(135deg,var(--a),var(--d));color:#fff;box-shadow:0 4px 14px #8b5cf688}
.pick{position:relative;overflow:hidden}.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:100px;cursor:pointer}
#bar{height:12px;border-radius:6px;background:#ffffff18;overflow:hidden;margin:10px 0}#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--b),var(--a),var(--c))}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

#lp{display:none;flex-direction:column;gap:8px;padding:10px 12px;margin:6px 8px;background:linear-gradient(160deg,#2a1f4a,#171031);border-radius:20px;border:1px solid #ffffff1c}#lp.on{display:flex}
.lg{display:none;align-items:center;gap:10px;min-height:46px}.lg.on{display:flex}.lg input[type=range]{flex:1}.lg output{min-width:52px;text-align:center;color:var(--c);font-weight:800}
#ot{position:absolute;top:140px;left:0;height:26px;width:100%}
#ot b{position:absolute;top:0;height:100%;border-radius:10px;background:linear-gradient(135deg,#22c55e,#2ee6d6);color:#04210f;font-size:12px;font-weight:800;padding:6px 8px;overflow:hidden;white-space:nowrap;touch-action:none}
#ot b.sel{outline:2px solid #fff}#ot b::after{content:"";position:absolute;right:5px;top:25%;bottom:25%;width:4px;border-radius:3px;background:#0007}
.ly{position:absolute;transform:translate(-50%,-50%);touch-action:none;z-index:2;max-width:none;display:none}.ly.sel{outline:2px dashed var(--c)}
.tabs{display:flex;gap:6px}.tabs button{flex:1;padding:8px 0;border-radius:12px;background:#ffffff10;font-weight:800;font-size:12px}.tabs button.on{background:linear-gradient(135deg,var(--a),var(--d))}
.tg{display:none;align-items:center;gap:10px;min-height:46px}.tg.on{display:flex}.tg input[type=range]{flex:1}.tg input[type=color]{flex:none;width:42px;height:42px;border:3px solid #fff;border-radius:50%;padding:0;background:none}
.fl2{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none}.fl2 .chip{flex:none;font-size:15px;padding:9px 14px}
.ib{background:#ffffff12}
.chip{background:#ffffff14;border:1px solid #ffffff1a;border-radius:99px}
.exp{border-radius:99px;background:linear-gradient(135deg,var(--a),var(--d));box-shadow:0 4px 18px #ff4fa388}
.nv{background:linear-gradient(120deg,#ff4fa3,#8b5cf6 55%,#2ee6d6);border-radius:26px;padding:20px 16px;box-shadow:0 12px 34px #8b5cf666,inset 0 1px 0 #ffffff55}
.qa button{background:linear-gradient(160deg,#ffffff14,#ffffff06);border:1px solid #ffffff14;border-radius:18px;padding:14px 4px}
.pc{background:linear-gradient(160deg,#ffffff10,#ffffff05);border:1px solid #ffffff12;border-radius:18px;padding:10px;box-shadow:0 6px 18px #0006}
.pc video{border-radius:14px}
.sw{display:inline-flex;align-items:center;gap:10px;padding:6px 8px 6px 14px;margin-left:8px;border-radius:99px;background:#ffffff14;font-weight:800;font-size:13px}
.sw::after{content:"";width:44px;height:26px;border-radius:99px;background:#ffffff2a radial-gradient(circle at 13px 13px,#fff 10px,transparent 11px);transition:.2s}
.sw.on::after{background:var(--b) radial-gradient(circle at 31px 13px,#fff 10px,transparent 11px)}
#pp{width:46px;height:46px;background:linear-gradient(135deg,var(--a),var(--d));color:#fff;box-shadow:0 4px 16px #ff4fa388;border-radius:50%}
</style></head><body>

<div class="sheet" id="sts"><div><h3>Aj
